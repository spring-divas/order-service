apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - name: order-service
          image: order-service:0.0.1-SNAPSHOT
          imagePullPolicy: Never

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 8080

          env:
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: APP_ENVIRONMENT
            - name: OTLP_TRACES_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: OTLP_TRACES_ENDPOINT
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: USER_SERVICE_URL
            - name: VENUE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: VENUE_SERVICE_URL
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: PAYMENT_SERVICE_URL
            - name: PAYMENT_GRPC_TARGET
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: PAYMENT_GRPC_TARGET
            - name: VENUE_GRPC_TARGET
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: VENUE_GRPC_TARGET
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: DISH_SYNC_TRANSPORT
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: DISH_SYNC_TRANSPORT

          envFrom:
            - secretRef:
                name: order-secret

          resources:
            requests:
              cpu: 100m
              memory: 384Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 500Mi

          startupProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60

          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: ClusterIP

  selector:
    app: order-service

  ports:
    - name: http
      port: 8080
      targetPort: 8080
