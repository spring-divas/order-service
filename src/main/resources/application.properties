spring.config.import=resilience4j.yaml,kafka.yaml

spring.mvc.problemdetails.enabled=true

server.servlet.context-path=/api

spring.application.name=order-service

server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

management.tracing.sampling.probability=1.0
management.endpoint.health.probes.enabled=true
management.observations.annotations.enabled=true
management.otlp.metrics.export.enabled=false
management.endpoints.web.exposure.include=health,metrics,prometheus
management.tracing.propagation.type=w3c
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT}

payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8084}
venue.service.url=${VENUE_SERVICE_URL:http://localhost:8081}

spring.profiles.active=${APP_ENVIRONMENT:dev}