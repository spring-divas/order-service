spring:
  grpc:
    client:
      channel:
        payment:
          target: ${PAYMENT_GRPC_TARGET:static://localhost:9090}
          default:
            load-balancing-policy: round_robin
            deadline: 5s
        dish:
          target: ${VENUE_GRPC_TARGET:static://localhost:9091}
          default:
            load-balancing-policy: round_robin
