spring.application.name=order-service

dish.sync.transport=kafka
dish-stream.reconnect-delay-ms=5000

spring.config.import=resilience4j.yaml,kafka.yaml,grpc.yaml

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
security.jwt.enabled=false

payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8084}
venue.service.url=${VENUE_SERVICE_URL:http://localhost:8081}
user.service.url=${USER_SERVICE_URL:http://localhost:8082}

server.servlet.context-path=/api
management.endpoints.web.exposure.include=health,metrics,prometheus
